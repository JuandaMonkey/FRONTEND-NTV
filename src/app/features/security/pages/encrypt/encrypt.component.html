<div class="encrypt-container">
  <h2 class="text-center mb-4">Encriptar Texto</h2>
  
  <!-- Sección de claves -->
  <div class="card mb-4">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Claves RSA</h5>
    </div>
    <div class="card-body">
      <div class="mb-3">
        <label for="publicKey" class="form-label">Clave Pública</label>
        <div class="input-group">
          <input type="text" class="form-control" id="publicKey" [value]="publicKey" readonly>
          <button class="btn btn-outline-secondary" type="button" (click)="copyToClipboard()">
            <i class="bi bi-clipboard"></i> Copiar
          </button>
        </div>
      </div>
      
      <div class="mb-3">
        <label class="form-label">Clave Privada</label>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-primary" (click)="downloadPrivateKey()">
            <i class="bi bi-download"></i> Descargar Clave Privada
          </button>
        </div>
        
        <div class="alert alert-warning mt-2">
          <small>
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            ¡Guarda esta clave en un lugar seguro! Sin ella no podrás desencriptar los mensajes.
          </small>
        </div>
      </div>
      
      <button class="btn btn-primary" (click)="generateNewKeys()" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
        Generar Nuevas Claves
      </button>
    </div>
  </div>

  <!-- Formulario de encriptación -->
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Encriptar Mensaje</h5>
    </div>
    <div class="card-body">
      <div class="mb-3">
        <label for="textToEncrypt" class="form-label">Texto a Encriptar</label>
        <textarea 
          class="form-control" 
          id="textToEncrypt" 
          [(ngModel)]="textToEncrypt" 
          rows="4" 
          placeholder="Escribe el texto que deseas encriptar aquí..."
        ></textarea>
      </div>
      
      <div class="d-flex gap-2 mb-3">
        <button class="btn btn-primary" (click)="encryptText()" [disabled]="!textToEncrypt || isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          Encriptar
        </button>
        <button class="btn btn-outline-secondary" (click)="clearForm()">
          <i class="bi bi-x-circle"></i> Limpiar
        </button>
      </div>
      
      <!-- Resultado de la encriptación -->
      <div class="mb-3" *ngIf="encryptedText">
        <label for="encryptedText" class="form-label">Texto Encriptado</label>
        <div class="input-group">
          <textarea 
            class="form-control" 
            id="encryptedText" 
            [value]="encryptedText" 
            rows="4" 
            readonly
          ></textarea>
          <button class="btn btn-outline-secondary" type="button" (click)="copyToClipboard()">
            <i class="bi bi-clipboard"></i> Copiar
          </button>
        </div>
      </div>
      
      <!-- Mensajes de error -->
      <div *ngIf="error" class="alert alert-danger mt-3">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ error }}
      </div>
      
      <!-- Mensaje de éxito al copiar -->
      <div *ngIf="showCopiedMessage" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        ¡Texto copiado al portapapeles!
        <button type="button" class="btn-close" (click)="showCopiedMessage = false" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>
</div>
