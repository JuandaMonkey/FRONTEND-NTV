<!-- botón estándar -->
<button 
  *ngIf="type !== 'control-up' && type !== 'control-down'" 
  class="btn {{ type }}" 
  (click)="click()"
  [attr.aria-label]="ariaLabel || label">
  <i *ngIf="icon" class="{{ icon }}" aria-hidden="true"></i>
  {{ label }}
</button>

<!-- botón de arriba -->
<button 
  *ngIf="type === 'control-up'" 
  class="control-btn" 
  (click)="click()"
  [attr.aria-label]="ariaLabel || 'Anterior'">
  <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
</button>

<!-- botón de abajo -->
<button 
  *ngIf="type === 'control-down'" 
  class="control-btn" 
  (click)="click()"
  [attr.aria-label]="ariaLabel || 'Siguiente'">
  <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
</button>
